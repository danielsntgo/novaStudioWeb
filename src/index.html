<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FlexPos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    .arranque{position:fixed;inset:0;display:grid;place-items:center;background:#f5f5f7}
    .arranque__marca{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#4aa0f7,#0071e3);
      display:grid;place-items:center;color:#fff;font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      box-shadow:0 10px 30px rgba(0,113,227,.28);animation:latido 1.4s ease-in-out infinite}
    @keyframes latido{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.8}}
  </style>
</head>
<body>
  <app-root>
    <div class="arranque" role="status" aria-label="Cargando FlexPos"><div class="arranque__marca">F</div></div>
  </app-root>
</body>
</html>
