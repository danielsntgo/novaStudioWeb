<div class="fp-pagina">
  <header class="fp-pagina__cabecera">
    <div>
      <h1 class="fp-pagina__titulo">Ventas</h1>
      <p class="fp-pagina__subtitulo">Historial de ventas, abonos, devoluciones y documentos.</p>
    </div>
    <a class="fp-boton" routerLink="/ventas/nueva"><svg app-icono="mas" [tamano]="18"></svg> Nueva venta</a>
  </header>

  <div class="fp-herramientas">
    <div class="cliente"><app-selector-cliente inputId="filtro-cliente-ventas" marcador="Filtrar por cliente" [valor]="cliente()" (valorChange)="alElegirCliente($event)" /></div>
    <select class="fp-input fp-select filtro" aria-label="Estado" [ngModel]="estado()" (ngModelChange)="filtrar('estado', $event)">
      <option value="">Todos los estados</option>
      @for (e of estados; track e.valor) { <option [value]="e.valor">{{ e.texto }}</option> }
    </select>
    <label class="fecha">Desde <input type="date" class="fp-input" [ngModel]="desde()" (ngModelChange)="filtrar('desde', $event)" /></label>
    <label class="fecha">Hasta <input type="date" class="fp-input" [ngModel]="hasta()" (ngModelChange)="filtrar('hasta', $event)" /></label>
    @if (hayFiltros()) { <button type="button" class="fp-enlace" (click)="limpiar()">Limpiar filtros</button> }
  </div>

  @if (error(); as mensaje) {
    <div class="fp-alerta error" role="alert"><svg app-icono="alerta" [tamano]="18"></svg><span>{{ mensaje }}</span><button type="button" class="fp-enlace" (click)="cargar()">Reintentar</button></div>
  }

  <section class="fp-tarjeta fp-tarjeta--plana" [attr.aria-busy]="cargando()">
    <app-tabla [columnas]="columnas" [filas]="filas()" [cargando]="cargando()" vacioTitulo="No hay ventas" [vacioDetalle]="hayFiltros() ? 'Prueba con otros filtros.' : 'Registra la primera con el botón «Nueva venta».'">
      <ng-template #acciones let-fila><button type="button" class="fp-enlace" (click)="seleccionada.set(fila)">Ver detalle</button></ng-template>
    </app-tabla>
    <app-paginador [pagina]="pagina()" [tamano]="20" [total]="total()" (cambio)="irA($event)" />
  </section>
</div>

<app-panel-lateral [abierto]="seleccionada() !== null" titulo="Detalle de la venta" [subtitulo]="seleccionada()?.clienteNombre ?? 'Cliente general'" ancho="ancho" (cerrar)="seleccionada.set(null)">
  @if (seleccionada(); as v) {
    <app-detalle-venta [venta]="v" (cambio)="cargar()" />
  }
</app-panel-lateral>
